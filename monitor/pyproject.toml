[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "domaindoctor"
version = "0.1.0"
description = "DomainDoctor: weekly plain-English domain check-ups for small businesses, using public information only"
requires-python = ">=3.10"
dependencies = ["pyyaml"]

[project.scripts]
domaindoctor = "domaindoctor.cli:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["domaindoctor*"]
